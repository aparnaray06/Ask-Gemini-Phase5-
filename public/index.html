<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Decorative elements -->
    <div class="star star-1">✦</div>
    <div class="star star-2">✦</div>
    <div class="star star-3">✦</div>

    <main>

        <!-- Header -->
        <div class="header">
            <div class="gemini-icon">✦</div>
            <h1>Ask Gemini</h1>
        </div>

        <p class="subtitle">
            Ask anything. Get AI-powered answers instantly.
        </p>

        <!-- Main Card -->
        <div class="card">

            <h2>Ask Gemini</h2>

            <input
                id="input"
                type="text"
                placeholder="What is React.js?"
            >

            <button id="generateBtn">
                <span>✦</span>
                Generate answer
            </button>

            <!-- Result -->
            <div id="result">

                <div class="answer-header">
                    <div class="answer-icon">✦</div>
                    <h3>Answer</h3>
                </div>

                <p id="prompt">
                    Your answer will appear here...
                </p>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
